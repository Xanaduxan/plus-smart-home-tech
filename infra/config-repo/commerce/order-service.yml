server:
  port: 0
  forward-headers-strategy: framework

spring:
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true

  datasource:
    url: jdbc:postgresql://localhost:5432/order_db
    username: dbuser
    password: "12345"
  jpa:
    hibernate:
      ddl-auto: update
  sql:
    init:
      mode: never
springdoc:
  api-docs:
    path: /docs/orders/v3/api-docs
  swagger-ui:
    path: /docs/orders/swagger-ui.html