spring:
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true

      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowed-origins:
              - "http://localhost:8443"
            allowed-methods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowed-headers:
              - Authorization
              - Content-Type
              - Accept

      routes:
        - id: product_docs_route
          uri: lb://product-service
          predicates:
            - Path=/docs/products/**

        - id: inventory_docs_route
          uri: lb://inventory-service
          predicates:
            - Path=/docs/inventory/**

        - id: order_docs_route
          uri: lb://order-service
          predicates:
            - Path=/docs/orders/**

        - id: product_service_route
          uri: lb://product-service
          predicates:
            - Path=/api/products/**,/api/categories/**
          filters:
            - name: Retry
              args:
                retries: 1
                methods: GET
                statuses: NOT_FOUND
                series: ""
                exceptions: ""

        - id: inventory_service_route
          uri: lb://inventory-service
          predicates:
            - Path=/api/inventory/**

        - id: order_service_route
          uri: lb://order-service
          predicates:
            - Path=/api/orders/**

server:
  port: 8080

app:
  security:
    users:
      - username: ivan
        password: ivan
        roles:
          - USER
      - username: anna
        password: anna
        roles:
          - USER
          - ADMIN