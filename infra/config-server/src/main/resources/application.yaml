server:
  port: 8888

spring:
  application:
    name: config-server
  profiles:
    active: native
  cloud:
    config:
      server:
        native:
          searchLocations:
            - classpath:config/telemetry/{application}
            - file:./infra/config-repo/
            - file:./infra/config-repo/commerce/
eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/