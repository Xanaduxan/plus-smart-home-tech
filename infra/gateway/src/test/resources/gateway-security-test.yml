spring:
  application:
    name: gateway-security-test
  main:
    web-application-type: reactive
  cloud:
    config:
      enabled: false
    discovery:
      enabled: false
    gateway:
      discovery:
        locator:
          enabled: false
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowed-origins:
              - "http://localhost:8443"
            allowed-methods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowed-headers:
              - Authorization
              - Content-Type
              - Accept

eureka:
  client:
    enabled: false

app:
  security:
    users:
      - username: ivan
        password: ivan
        roles:
          - USER
      - username: anna
        password: anna
        roles:
          - USER
          - ADMIN